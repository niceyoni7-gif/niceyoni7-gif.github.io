<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם הנעל - חנות נעליים איכותית</title>
    <style>
        :root {
            --leather: #7b2ff7;
            --leather-dark: #5a1fc4;
            --sole: #ff4d6d;
            --sole-dark: #e8324f;
            --pop: #ffd60a;
            --pop-dark: #f0b800;
            --bg: #f3f0ff;
            --card-bg: #ffffff;
            --ink: #1f1430;
            --ink-soft: #6a5d8a;
            --rule: #e3d9ff;
            --stitch: #ffd60a;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 10% 10%, rgba(255,77,109,0.10) 0, transparent 40%),
                               radial-gradient(circle at 90% 90%, rgba(123,47,247,0.10) 0, transparent 40%);
            color: var(--ink);
            line-height: 1.6;
            transition: background-color 0.5s ease, background-image 0.5s ease;
        }

        body.bg-mens {
            background-color: #bcd6ff;
            background-image: radial-gradient(circle at 10% 10%, rgba(37,99,235,0.55) 0, transparent 55%),
                               radial-gradient(circle at 90% 90%, rgba(29,78,216,0.45) 0, transparent 55%);
        }

        body.bg-womens {
            background-color: #ffc2cf;
            background-image: radial-gradient(circle at 10% 10%, rgba(225,29,72,0.55) 0, transparent 55%),
                               radial-gradient(circle at 90% 90%, rgba(190,18,60,0.45) 0, transparent 55%);
        }

        body.bg-kids {
            background-color: #d6c2ff;
            background-image: radial-gradient(circle at 10% 10%, rgba(147,51,234,0.5) 0, transparent 55%),
                               radial-gradient(circle at 90% 90%, rgba(20,184,166,0.45) 0, transparent 55%);
        }

        header {
            background: linear-gradient(135deg, var(--leather) 0%, var(--sole) 100%);
            padding: 46px 20px 34px;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 6px;
            background: repeating-linear-gradient(90deg, var(--stitch) 0 10px, transparent 10px 20px);
            opacity: 0.7;
        }

        .eyebrow {
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            margin-bottom: 8px;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.18);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            margin: 10px 0 24px;
        }

        /* תיבת מידע על העסק */
        .business-info {
            background: rgba(255, 255, 255, 0.12);
            display: inline-block;
            padding: 16px 26px;
            border-radius: 12px;
            font-size: 14.5px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);
            text-align: right;
        }
        .info-line {
            margin: 5px 0;
        }

        /* ניווט קטגוריות מעוצב */
        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.25s ease;
            color: #ffffff;
        }

        .tab-btn:hover {
            background-color: rgba(255, 255, 255, 0.26);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background-color: #ffffff;
            color: var(--leather-dark);
            border-color: #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.22);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 20px 70px;
        }

        /* גריד גלריה */
        .gallery-section {
            display: none;
        }

        .gallery-section.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* כרטיס מוצר */
        .product-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(123, 47, 247, 0.10);
            border: 1px solid var(--rule);
            text-align: center;
            padding: 22px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 34px rgba(123, 47, 247, 0.18);
            border-color: var(--sole);
        }

        .image-container {
            width: 100%;
            height: 240px;
            background-color: #f0ecff;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--rule);
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 6px 0;
        }

        .product-title {
            font-size: 19px;
            color: var(--leather-dark);
            margin: 0 0 10px;
            font-weight: 700;
        }

        .product-price {
            color: var(--leather-dark);
            font-size: 16px;
            font-weight: 800;
            margin: 0 0 18px;
            background: var(--pop);
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
        }

        /* כפתור חיוג טלפוני */
        .order-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--sole);
            color: white;
            text-decoration: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 5px 14px rgba(255, 77, 109, 0.38);
        }

        .order-btn:hover {
            background-color: var(--sole-dark);
            transform: translateY(-2px);
        }

        /* פוטר */
        footer {
            text-align: center;
            padding: 26px 20px 34px;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--ink-soft);
            text-transform: uppercase;
        }

        footer strong {
            color: var(--leather-dark);
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

<header>
    <div class="eyebrow">בני ברק · נעליים לכל המשפחה</div>
    <h1>עולם הנעל</h1>
    <div class="subtitle">מבחר נעליים איכותיות לכל המשפחה</div>

    <!-- פרטי העסק כפי שביקשת -->
    <div class="business-info">
        <div class="info-line">📍 <strong>כתובתנו:</strong> רחוב שפת אמת 10, בני ברק</div>
        <div class="info-line">⏰ <strong>שעות פתיחה:</strong> 18:00 עד 22:00 בלילה</div>
        <div class="info-line">📞 <strong>טלפון לבירורים והזמנות:</strong> 052-7174064</div>
    </div>

    <div class="categories-nav">
        <button class="tab-btn active" onclick="showCategory('mens')">גברים</button>
        <button class="tab-btn" onclick="showCategory('womens')">נשים</button>
        <button class="tab-btn" onclick="showCategory('kids')">ילדים</button>
    </div>
</header>

<div class="container">

    <!-- גלריית גברים -->
    <div id="mens" class="gallery-section active"></div>

    <!-- גלריית נשים -->
    <div id="womens" class="gallery-section"></div>

    <!-- גלריית ילדים -->
    <div id="kids" class="gallery-section"></div>

</div>

<footer>
    האתר נבנה על ידי <strong>niceyoni.com</strong>
</footer>

<script>
    // ===== הגדרת תמונות המוצרים =====
    // שם הקובץ קובע הכל: <מספר דגם>-<מחיר בש"ח>.jpg (או .png)
    // נתמכים: jpg, jpeg, png, webp — לפי אותם כללים בדיוק
    // מספר הדגם קובע את הקטגוריה:
    //   101–199 → גברים | 201–299 → נשים | 301–399 → ילדים
    // לדוגמה: "101-350.jpg" = נעל גברים, דגם 101, מחיר 350 ש"ח
    //          "201-249.png" = נעל נשים, דגם 201, מחיר 249 ש"ח
    // כדי להוסיף מוצר חדש - פשוט הוסף את שם הקובץ לרשימה למטה.
    const PRODUCT_IMAGES = [
        "101-350.jpg",
        "102-299.png",
        "201-249.jpg",
        "202-279.png",
        "301-180.jpg"
    ];

    const FOLDER = "images/"; // התיקייה בה נמצאות תמונות המוצרים

    const CATEGORY_LABELS = {
        mens: "נעל גברים",
        womens: "נעל נשים",
        kids: "נעל ילדים"
    };

    function getCategoryFromModelNumber(modelNumber) {
        if (modelNumber >= 101 && modelNumber <= 199) return "mens";
        if (modelNumber >= 201 && modelNumber <= 299) return "womens";
        if (modelNumber >= 301 && modelNumber <= 399) return "kids";
        return null;
    }

    function buildGalleries() {
        const galleries = { mens: [], womens: [], kids: [] };

        PRODUCT_IMAGES.forEach(filename => {
            const match = filename.match(/^(\d+)-(\d+)\.(jpg|jpeg|png|webp)$/i);
            if (!match) {
                console.warn("שם קובץ לא תקני, מדלג:", filename);
                return;
            }

            const modelNumber = parseInt(match[1], 10);
            const price = parseInt(match[2], 10);
            const category = getCategoryFromModelNumber(modelNumber);

            if (!category) {
                console.warn("מספר דגם מחוץ לטווח הקטגוריות, מדלג:", filename);
                return;
            }

            galleries[category].push({
                src: FOLDER + filename,
                title: CATEGORY_LABELS[category] + " — דגם " + modelNumber,
                price: price
            });
        });

        Object.keys(galleries).forEach(category => {
            const container = document.getElementById(category);
            container.innerHTML = "";

            galleries[category].forEach(product => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <div>
                        <div class="image-container">
                            <img src="${product.src}" alt="${product.title}">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">${product.price} ש"ח</div>
                        </div>
                    </div>
                    <a href="tel:0527174064" class="order-btn">
                        <span>לחץ לחיוג ובירור על הדגם</span>
                    </a>
                `;
                container.appendChild(card);
            });
        });
    }

    function showCategory(categoryId) {
        document.querySelectorAll('.gallery-section').forEach(section => {
            section.classList.remove('active');
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        document.getElementById(categoryId).classList.add('active');
        event.currentTarget.classList.add('active');

        document.body.classList.remove('bg-mens', 'bg-womens', 'bg-kids');
        document.body.classList.add('bg-' + categoryId);
    }

    buildGalleries();
    document.body.classList.add('bg-mens');
</script>

</body>
</html>
