<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עולם הנעל - חנות נעליים איכותית</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
        }
        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h1 {
            margin: 0;
            color: #222;
            font-size: 28px;
        }
        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }
        .tab-btn {
            background-color: #fff;
            border: 2px solid #ddd;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.2s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            background-color: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 50px;
        }
        .gallery-section {
            display: none;
        }
        .gallery-section.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            padding: 15px;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product-title {
            font-size: 18px;
            margin: 12px 0 6px;
            font-weight: bold;
        }
        .product-price {
            color: #28a745;
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 10px;
        }
    </style>
</head>
<body>

<header>
    <h1>עולם הנעל</h1>
    <p>מבחר נעליים איכותיות לכל המשפחה</p>
    
    <!-- כפתורי הניווט בין הקטגוריות -->
    <div class="categories-nav">
        <button class="tab-btn active" onclick="showCategory('mens')">גברים</button>
        <button class="tab-btn" onclick="showCategory('womens')">נשים</button>
        <button class="tab-btn" onclick="showCategory('kids')">ילדים</button>
    </div>
</header>

<div class="container">

    <!-- גלריית גברים -->
    <div id="mens" class="gallery-section active">
        <div class="product-card">
            <img src="images/mens-shoe1.jpg" alt="נעל גברים דגם א">
            <div class="product-title">נעל ספורט אלגנט גברים</div>
            <div class="product-price">299 ש"ח</div>
        </div>
        <div class="product-card">
            <img src="images/mens-shoe2.jpg" alt="נעל גברים דגם ב">
            <div class="product-title">נעלי ריצה מקצועיות</div>
            <div class="product-price">349 ש"ח</div>
        </div>
    </div>

    <!-- גלריית נשים -->
    <div id="womens" class="gallery-section">
        <div class="product-card">
            <img src="images/womens-shoe1.jpg" alt="נעל נשים דגם א">
            <div class="product-title">נעל הליכה נוחה</div>
            <div class="product-price">249 ש"ח</div>
        </div>
    </div>

    <!-- גלריית ילדים -->
    <div id="kids" class="gallery-section">
        <div class="product-card">
            <img src="images/kids-shoe1.jpg" alt="נעל ילדים דגם א">
            <div class="product-title">נעל ספורט סקוץ' לילדים</div>
            <div class="product-price">180 ש"ח</div>
        </div>
    </div>

</div>

<script>
    // פונקציה למעבר חלק בין הגלריות ללא טעינת דף מחדש
    function showCategory(categoryId) {
        // הסתרת כל הגלריות
        document.querySelectorAll('.gallery-section').forEach(section => {
            section.classList.remove('active');
        });
        // הסרת עיצוב פעיל מכל הכפתורים
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        // הצגת הגלריה הנבחרת
        document.getElementById(categoryId).classList.add('active');
        // סימון הכפתור הנוכחי כפעיל
        event.currentTarget.classList.add('active');
    }
</script>

</body>
</html>
